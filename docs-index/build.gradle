plugins {
    id 'groovy'
}

group = 'io.xh'
version = rootProject.ext.xhReleaseVersion

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.1.3'
    implementation 'org.apache.groovy:groovy-json:5.1.3'
}

//------------------------
// Hoist Docs index
//------------------------
// Builds the index file (docs, Groovy/Java symbols, members) served by the Hoist Docs service.
// Development tooling only - nothing here is published.
tasks.register('buildIndex', JavaExec) {
    group = 'documentation'
    description = 'Builds the Hoist Docs index file (docs, symbols, members) for this checkout.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.xh.hoist.docsindex.index.IndexBuilder'
    args '--root', rootProject.projectDir.absolutePath,
        '--out', layout.buildDirectory.dir('docs-index').get().asFile.absolutePath,
        '--version', project.version.toString()
}
