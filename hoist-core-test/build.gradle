//------------------------
// hoist-core-test: Spock-based unit testing support for applications built on hoist-core.
// Published as io.xh:hoist-core-test alongside hoist-core, at the same version. Apps add it as a
// single testImplementation dependency. See docs/testing.md.
//------------------------
plugins {
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.xh'
version = rootProject.version

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.grails.org/grails/restricted'
    }
}

//--------------------
// JDK - same contract as hoist-core: JDK 25 toolchain, Java 17 bytecode.
//--------------------
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}
tasks.withType(GroovyCompile).configureEach {
    options.release = 17
    sourceCompatibility = '17'
    targetCompatibility = '17'
    groovyOptions.parameters = true
}
// Sources are Groovy-only, so fill the published javadoc jar from Groovydoc.
tasks.named('javadocJar', Jar) {
    from tasks.named('groovydoc')
}

dependencies {
    // Same BOM as hoist-core, so Spock, JUnit and Grails testing support align with the app's Grails line.
    api platform("org.apache.grails:grails-bom:$grailsVersion")
    api project(':')

    api 'org.spockframework:spock-core'
    api 'org.apache.grails:grails-testing-support-web'
    api 'org.apache.grails:grails-testing-support-datamapping'

    // Enable Spock Mock()/Stub() of concrete classes, including those without a no-arg constructor.
    runtimeOnly 'net.bytebuddy:byte-buddy'
    runtimeOnly 'org.objenesis:objenesis'
    runtimeOnly 'org.junit.platform:junit-platform-launcher'
}

apply from: rootProject.file('gradle/test-conventions.gradle')

//------------------------
// Maven Central publishing
//------------------------
publishing {
    publications {
        hoistCoreTest(MavenPublication) {
            groupId = 'io.xh'
            artifactId = 'hoist-core-test'

            from components.java

            // Write resolved versions into the POM rather than relying on the imported BOM.
            versionMapping {
                usage('java-api') { fromResolutionOf('runtimeClasspath') }
                usage('java-runtime') { fromResolutionResult() }
            }

            pom {
                name = 'hoist-core-test'
                description = 'Spock-based unit testing support for applications built on hoist-core.'
                url = 'https://xh.io'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                organization {
                    name = 'Extremely Heavy Industries'
                    url = 'https://xh.io'
                }
                scm {
                    url = 'https://github.com/xh/hoist-core'
                    connection = 'scm:git@github.com:xh/hoist-core.git'
                    developerConnection = 'scm:git@github.com:xh/hoist-core.git'
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/xh/hoist-core/issues'
                }
                developers {
                    developer {
                        id = 'xh'
                        name = 'Extremely Heavy Industries'
                        email = 'info@xh.io'
                    }
                }
            }
        }
    }
}

ext.isReleaseVersion = !version.toString().endsWith('SNAPSHOT')
afterEvaluate {
    signing {
        required { isReleaseVersion && gradle.taskGraph.hasTask('publish') }
        def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
        def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.hoistCoreTest
    }
}
tasks.withType(Sign).configureEach {
    onlyIf { isReleaseVersion }
}
